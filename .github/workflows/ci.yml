name: CI

# Runs only when something that can change the build result changes: Rust sources, the
# manifests and lock file, the check scripts, the GNOME Shell extension, or this workflow.
# Docs-only changes skip it.
on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - "extension/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - "extension/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # tests/ayatana_label.rs runs a private session bus; it fails, never skips, without one.
      - run: command -v dbus-daemon || (sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon)

      # statsbar-panel links GTK 4 and libadwaita; their headers and .pc files come from these.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev

      # scripts/check-extension.sh runs the GNOME Shell extension's tests with gjs.
      - run: command -v gjs || (sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs)

      # The single verification entry point: fmt, clippy, tests and the core purity gate.
      - run: ./scripts/check.sh
